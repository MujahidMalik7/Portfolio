<path d="M904 316V240" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="918" y="285" font-size="20" font-weight="500" fill="#24497F" text-anchor="start" stroke="#EAF0F8" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Verify JWT</text>
<path d="M1016 350H1286" fill="none" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)" marker-start="url(#ams)"/>
<text x="1151" y="338" font-size="20" font-weight="500" fill="#24497F" text-anchor="middle" stroke="#F6F7FA" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Read / write</text>
<path d="M1016 488H1286" fill="none" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="1151" y="476" font-size="20" font-weight="500" fill="#24497F" text-anchor="middle" stroke="#F6F7FA" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Prompt + history</text>
<path d="M1286 534H1016" fill="none" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="1151" y="568" font-size="20" font-weight="500" fill="#24497F" text-anchor="middle" stroke="#F6F7FA" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Token stream</text>
<path d="M16 760H1584" stroke="rgba(11,27,58,.10)" stroke-width="1"/>
<rect x="81.5" y="790" width="204.6" height="48" rx="24" fill="#C9A96E" fill-opacity=".22" stroke="#C9A96E" stroke-width="1.5"/>
<text x="183.8" y="821" font-size="22" font-weight="600" fill="#0B1B3A" text-anchor="middle">SSE streaming</text>
<rect x="304.1" y="790" width="357.7" height="48" rx="24" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1"/>
