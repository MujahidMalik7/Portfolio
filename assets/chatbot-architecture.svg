<text x="776" y="634" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">Static file server</text>
<text x="776" y="662" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">Serves the web UI</text>
<rect x="1286" y="264" width="278" height="120" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="1425" y="305" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">Relational DB</text>
<text x="1425" y="333" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">users · conversations ·</text>
<text x="1425" y="357" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">messages</text>
<rect x="1286" y="468" width="278" height="120" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="1425" y="509" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">LLM service</text>
<text x="1425" y="537" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">Anthropic Claude,</text>
<text x="1425" y="561" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">streaming</text>
<path d="M248 383H536" fill="none" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="392" y="371" font-size="20" font-weight="500" fill="#24497F" text-anchor="middle" stroke="#F6F7FA" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Login / chat request</text>
