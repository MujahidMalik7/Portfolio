<text x="392" y="527" font-size="22" font-weight="600" fill="#24497F" text-anchor="middle" stroke="#F6F7FA" stroke-width="6" paint-order="stroke" stroke-linejoin="round">SSE stream</text>
<path d="M648 240V316" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linejoin="round" marker-end="url(#as)"/>
