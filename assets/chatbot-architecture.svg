<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>Full Stack AI Chatbot API: Architecture</title>
<desc>Architecture diagram of a streaming AI chatbot API: a single-page client app with an admin metrics view; an API layer with a FastAPI server, JWT auth, a per-IP rate limiter and a static file server; a relational database accessed through SQLAlchemy; and an LLM service whose token stream is relayed back to the client over SSE.</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1B3A" flood-opacity=".10"/></filter>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker>
<marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B8DEF"/></marker>
<marker id="amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F7FA"/>
<text x="24" y="52" font-size="34" font-weight="600" fill="#0B1B3A" font-family="Playfair Display, Georgia, serif">Full Stack AI Chatbot API: Architecture</text>
<rect x="16" y="305" width="248" height="238" rx="20" fill="#EAF0F8" stroke="rgba(11,27,58,.12)" stroke-width="1"/>
<text x="36" y="335" font-size="16" font-weight="600" fill="#4A5566" letter-spacing="1.6">FRONTEND</text>
<rect x="516" y="92" width="520" height="610" rx="20" fill="#EAF0F8" stroke="rgba(11,27,58,.12)" stroke-width="1"/>
<text x="536" y="122" font-size="16" font-weight="600" fill="#4A5566" letter-spacing="1.6">API LAYER</text>
<text x="1016" y="122" font-size="16" font-weight="500" fill="#4A5566" text-anchor="end">FastAPI + SlowAPI</text>
<rect x="1266" y="220" width="318" height="184" rx="20" fill="#EAF0F8" stroke="rgba(11,27,58,.12)" stroke-width="1"/>
<text x="1286" y="250" font-size="16" font-weight="600" fill="#4A5566" letter-spacing="1.6">DATA LAYER</text>
<text x="1564" y="250" font-size="16" font-weight="500" fill="#4A5566" text-anchor="end">SQLAlchemy ORM</text>
<rect x="1266" y="424" width="318" height="184" rx="20" fill="#EAF0F8" stroke="rgba(11,27,58,.12)" stroke-width="1"/>
<text x="1286" y="454" font-size="16" font-weight="600" fill="#4A5566" letter-spacing="1.6">EXTERNAL AI</text>
<rect x="32" y="353" width="216" height="170" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="140" y="401" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">Client app</text>
<text x="140" y="429" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">Single-page web UI</text>
<path d="M52 455H228" stroke="rgba(11,27,58,.14)" stroke-width="1"/>
<text x="140" y="486" font-size="18" font-weight="500" fill="#4A5566" text-anchor="middle">Admin metrics view</text>
<rect x="536" y="150" width="224" height="90" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="648" y="188" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">Rate limiter</text>
<text x="648" y="216" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">SlowAPI, per-IP</text>
<rect x="792" y="150" width="224" height="90" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="904" y="188" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">Auth</text>
<text x="904" y="216" font-size="20" font-weight="400" fill="#4A5566" text-anchor="middle">JWT · bcrypt</text>
<rect x="536" y="316" width="480" height="244" rx="14" fill="#fff" stroke="rgba(11,27,58,.12)" stroke-width="1" filter="url(#sh)"/>
<text x="776" y="433" font-size="26" font-weight="600" fill="#0B1B3A" text-anchor="middle">API server</text>
